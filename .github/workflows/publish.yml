on:
  push:
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: vars
        run: |
          echo "JAVA=$(mvn help:evaluate -Dexpression=maven.compiler.release -q -DforceStdout)" >> "$GITHUB_OUTPUT"
          echo "AFCT=$(mvn help:evaluate -Dexpression=project.build.finalName -q -DforceStdout)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: ${{ steps.vars.outputs.JAVA }}
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - run: |
          PROFILES="deploy.github"

          if [[ -n "$CODEBERG_USERNAME" && -n "$CODEBERG_PASSWORD" ]]; then
            PROFILES="$PROFILES,deploy.codeberg"
          fi

          mvn -B -DskipTests -P"$PROFILES" clean deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEBERG_USERNAME: ${{ vars.CODEBERG_USERNAME }}
          CODEBERG_PASSWORD: ${{ secrets.CODEBERG_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          path: target/${{ steps.vars.outputs.AFCT }}.jar
          name: ${{ steps.vars.outputs.AFCT }}
          if-no-files-found: error
